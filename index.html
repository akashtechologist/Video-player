
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Video</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .video-container {
      width: 100%;
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    .video-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .video-container {
        padding: 0;
        margin: 10px auto;
      }

      .video-frame {
        border-radius: 0;
      }
    }

  </style>
</head>

<body>

  <div class="video-container">
    <div class="video-frame">
      <iframe
        src="https://drive.google.com/file/d/1mUqakKXW0qMGAJoK3MtGEmC9ffv-Gd4D/preview"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>
  </div>

</body>
</html>
